<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Small, single-purpose tools built by Michael Spencer."
    />
    <title>Michael Spencer's Tools</title>
    <script>
      // Apply the saved theme before first paint to avoid a light-mode flash.
      // Keep in sync with src/components/theme-provider.tsx.
      try {
        const theme = localStorage.getItem("theme")
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      } catch {}
    </script>
    <!-- Privacy-friendly analytics by Plausible -->

      async
      src="https://analytics.sonrise.io/js/pa-xbCbWwyzZGJL4Q53tm_Im.js"
    ></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          ;(plausible.q = plausible.q || []).push(arguments)
        }
      plausible.init =
        plausible.init ||
        function (i) {
          plausible.o = i || {}
        }
      plausible.init()
    </script>
  </head>

    <div id="root"></div>

  </body>
</html>
